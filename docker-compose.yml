version: '3.9'
services:
  sikagestion:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_SUPER_ADMIN_LOGIN: ${VITE_SUPER_ADMIN_LOGIN}
        VITE_SUPER_ADMIN_PASSWORD_HASH: ${VITE_SUPER_ADMIN_PASSWORD_HASH}
        VITE_SIKA_SALT: ${VITE_SIKA_SALT}
        VITE_SIKA_MGMT_SECRET: ${VITE_SIKA_MGMT_SECRET}
        VITE_APP_URL: ${VITE_APP_URL:-}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0}
        VITE_DEBUG_MODE: ${VITE_DEBUG_MODE:-false}
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - nginx_logs:/var/log/nginx

volumes:
  nginx_logs:
    driver: local

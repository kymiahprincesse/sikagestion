<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Génération icônes PWA SIKA</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1B2A4A; color: white; padding: 40px; }
    h1 { color: #E60000; }
    button {
      background: #E60000; color: white; border: none;
      padding: 14px 28px; border-radius: 8px; font-size: 16px;
      cursor: pointer; margin-top: 20px;
    }
    button:hover { background: #c00000; }
    #log { margin-top: 20px; background: rgba(255,255,255,0.1);
           padding: 16px; border-radius: 8px; font-size: 13px; line-height: 1.8; }
    .ok { color: #4CAF50; }
  </style>
</head>
<body>
  <h1>Générateur d'icônes PWA — SIKA GESTION</h1>
  <p>Cliquez sur le bouton pour générer et télécharger toutes les icônes PWA depuis favicon.png.</p>
  <p>Placez ensuite les fichiers téléchargés dans le dossier <strong>public/</strong>.</p>
  <button onclick="generate()">Générer toutes les icônes</button>
  <div id="log"></div>

  <script>
    const sizes = [72, 96, 128, 144, 192, 512];
    const log = document.getElementById('log');

    function generate() {
      log.innerHTML = '⏳ Chargement du logo...';
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = '/favicon.png';

      img.onload = () => {
        log.innerHTML = '<span class="ok">✅ Logo chargé</span><br/>';
        sizes.forEach((size, i) => {
          setTimeout(() => {
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1B2A4A';
            ctx.fillRect(0, 0, size, size);
            ctx.drawImage(img, 0, 0, size, size);

            canvas.toBlob(blob => {
              const a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = `icon-${size}.png`;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              log.innerHTML += `<span class="ok">✅ icon-${size}.png téléchargée</span><br/>`;
              if (i === sizes.length - 1) {
                log.innerHTML += '<br/><strong style="color:#4CAF50">🎉 Terminé ! Déplacez les fichiers dans public/</strong>';
              }
            }, 'image/png');
          }, i * 300);
        });
      };

      img.onerror = () => {
        log.innerHTML = '❌ Erreur : ouvrez cette page depuis le serveur de développement (localhost:5173 ou similaire)';
      };
    }
  </script>
</body>
</html>
